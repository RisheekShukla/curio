<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Curio</title>
    <meta name="theme-color" content="#faf8f5" />
    <style>
      :root { color-scheme: light dark; --bg: #faf8f5; --fg: #2a2622; --muted: #75706a; --accent: #b0532a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1c1a18; --fg: #eeebe6; --muted: #a8a29b; --accent: #e08a5a; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 1.5rem; }
      main { max-width: 26rem; text-align: center; }
      h1 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 400; font-size: 2.5rem; margin: 0 0 .5rem; }
      p { color: var(--muted); line-height: 1.6; }
      button { margin-top: 1rem; border: 0; border-radius: 999px; padding: .7rem 1.4rem; font: inherit; background: var(--fg); color: var(--bg); cursor: pointer; }
      .dot { width: 2.5rem; height: 2.5rem; border-radius: 50%; background: var(--fg); display: grid; place-items: center; margin: 0 auto 1.5rem; }
      .dot span { width: 1rem; height: 1rem; border-radius: 50%; border: 3px solid var(--bg); }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"><span></span></div>
      <h1>You're offline</h1>
      <p>Curio needs a connection to load new discoveries, and the AI companion always requires internet access.</p>
      <p>Reconnect and try again — your saved items and history will be waiting.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
